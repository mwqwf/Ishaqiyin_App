name: ishaqiyin_app
description: "تطبيق الإسحاقيين — دروس صوتية وكتب"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase (consumer = read only)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0

  # Audio (streaming + local) with background/lockscreen controls
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.11

  # Downloads / files
  dio: ^5.7.0
  path_provider: ^2.1.5

  # Local storage / settings / cache
  shared_preferences: ^2.3.3

  # Sharing / opening / PDF
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  flutter_pdfview: ^1.3.2

  # Simple state management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
