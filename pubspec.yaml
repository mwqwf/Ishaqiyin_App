name: menbaradkshk
description: "منبر ادكصهك — دروس صوتية"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (consumer = read only + استقبال إشعارات الدفع)
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+7
  # «شارك درساً» 📤: هوية مجهولة للمساهم + رفع الصوت المقترح + اختيار الملف
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.0
  file_picker: ^8.1.2

  # Audio (streaming + local) with background/lockscreen controls
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.11

  # Downloads / files
  dio: ^5.7.0
  path_provider: ^2.1.5

  # Local storage / settings / cache
  shared_preferences: ^2.3.3

  # Sharing
  share_plus: ^10.1.2

  # Deep links, connectivity, notifications, feedback
  app_links: ^6.3.3
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  url_launcher: ^6.3.1

  # Simple state management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # ملاحظة حجم: مجلد assets/images (صور مصدر الأيقونات ونسخها الاحتياطية،
  # ~3.9MB) لا يُستعمل داخل الكود إطلاقاً — flutter_launcher_icons يقرؤه من
  # القرص وقت التوليد فقط، فلا يُحزَم في التطبيق.
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#020E1D"
  adaptive_icon_foreground: "assets/images/icon_fg.png"
